<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cultural Quest — Museum 2D</title>

<style>
:root {
  --cream: #f5ecd9;
  --brown: #4b3025;
  --dark: #29231f;
  --gold: #d7a85b;
  --green: #496b50;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  overflow: hidden;
  background: var(--dark);
  color: var(--cream);
  font-family: Arial, sans-serif;
}

button {
  font-family: inherit;
  cursor: pointer;
  touch-action: manipulation;
}

#game {
  position: relative;
  width: 100vw;
  height: 100dvh;
  overflow: hidden;
  background: #c9b99c;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
}

/* HEADER */

.topbar {
  position: absolute;
  z-index: 5;
  top: 12px;
  left: 12px;
  right: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  pointer-events: none;
}

.brand {
  padding: 10px 13px;
  background: rgba(41,35,31,.88);
  border: 2px solid #8c7250;
  color: #f5ecd9;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 1px;
}

.top-actions {
  display: flex;
  gap: 7px;
  pointer-events: auto;
}

.top-actions button {
  border: 1px solid #8c7250;
  background: rgba(41,35,31,.9);
  color: white;
  padding: 10px 12px;
  font-size: 12px;
}

/* MOVEMENT CONTROLS */

.controls {
  position: absolute;
  z-index: 5;
  left: 15px;
  bottom: 20px;
  display: flex;
  gap: 10px;
  align-items: center;
}

.move-btn {
  width: 57px;
  height: 57px;
  border: 2px solid #e0cba6;
  background: rgba(41,35,31,.88);
  color: white;
  font-size: 25px;
  border-radius: 8px;
  user-select: none;
}

.move-btn:active {
  background: #80603d;
  transform: translateY(2px);
}

#interact {
  position: absolute;
  z-index: 5;
  bottom: 27px;
  left: 50%;
  transform: translateX(-50%);
  padding: 13px 20px;
  border: 2px solid #f0d6a2;
  border-radius: 5px;
  color: #fff;
  background: #496b50;
  font-size: 13px;
  font-weight: bold;
  display: none;
}

#hint {
  position: absolute;
  z-index: 4;
  left: 50%;
  bottom: 95px;
  transform: translateX(-50%);
  width: max-content;
  max-width: 85%;
  padding: 9px 13px;
  text-align: center;
  background: rgba(41,35,31,.83);
  color: white;
  font-size: 12px;
  border-radius: 4px;
  pointer-events: none;
}

/* INFORMATION MODAL */

.modal {
  display: none;
  position: absolute;
  z-index: 20;
  inset: 0;
  background: rgba(19,16,14,.78);
  align-items: center;
  justify-content: center;
  padding: 14px;
}

.modal.show {
  display: flex;
}

.modal-card {
  width: min(570px, 100%);
  max-height: 92%;
  overflow-y: auto;
  background: var(--cream);
  color: var(--brown);
  border: 4px solid #8a6845;
  box-shadow: 0 8px 0 rgba(0,0,0,.25);
}

.modal-header {
  padding: 14px 16px;
  background: var(--brown);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.modal-header h2 {
  margin: 0;
  font-size: 18px;
}

.close-btn {
  flex-shrink: 0;
  width: 34px;
  height: 34px;
  background: transparent;
  color: white;
  border: 1px solid #d8c3a1;
  font-size: 22px;
}

.artwork-wrap {
  margin: 15px;
  height: 190px;
  background: #d9c9ad;
  border: 3px solid #b49a73;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.artwork-wrap img {
  max-width: 100%;
  max-height: 100%;
  width: 100%;
  height: 100%;
  object-fit: contain;
  image-rendering: pixelated;
}

.artwork-wrap img.original {
  image-rendering: auto;
  object-fit: contain;
  background: #eee5d5;
}

.modal-body {
  padding: 0 17px 18px;
}

.section-label {
  font-size: 10px;
  font-weight: bold;
  letter-spacing: 1.5px;
  color: #876641;
  margin-bottom: 5px;
}

.description {
  font-size: 13px;
  line-height: 1.6;
  margin: 0 0 14px;
}

.original-btn,
.back-image-btn {
  width: 100%;
  border: 0;
  padding: 13px;
  background: var(--green);
  color: white;
  font-weight: bold;
  font-size: 13px;
  margin-top: 3px;
}

.back-image-btn {
  background: var(--brown);
  display: none;
}

.footer-note {
  padding: 10px;
  text-align: center;
  color: #78644d;
  font-size: 10px;
  border-top: 1px solid #d6c5a9;
}

/* SMALL SCREEN */

@media (max-width: 480px) {
  .brand {
    font-size: 10px;
    padding: 9px;
  }

  .top-actions button {
    font-size: 10px;
    padding: 9px;
  }

  .move-btn {
    width: 51px;
    height: 51px;
  }

  #interact {
    bottom: 84px;
    font-size: 11px;
    padding: 12px 14px;
  }

  #hint {
    bottom: 145px;
    font-size: 11px;
  }

  .artwork-wrap {
    height: 155px;
  }

  .modal-header h2 {
    font-size: 15px;
  }
}
</style>
</head>

<body>
<div id="game">

  <canvas id="museum"></canvas>

  <div class="topbar">
    <div class="brand">CULTURAL QUEST</div>
    <div class="top-actions">
      <button id="fullscreenBtn">⛶ Layar penuh</button>
      <button id="homeBtn">← Kembali</button>
    </div>
  </div>

  <div id="hint">Jelajahi museum dan dekati objek pameran.</div>

  <div class="controls">
    <button class="move-btn" id="leftBtn" aria-label="Bergerak ke kiri">◀</button>
    <button class="move-btn" id="rightBtn" aria-label="Bergerak ke kanan">▶</button>
  </div>

  <button id="interact">LIHAT INFORMASI</button>

  <!-- PANEL INFORMASI OBJEK -->

  <div class="modal" id="infoModal">
    <div class="modal-card">

      <div class="modal-header">
        <h2 id="objectTitle">Nama Objek</h2>
        <button class="close-btn" id="closeModal" aria-label="Tutup">×</button>
      </div>

      <div class="artwork-wrap">
        <img id="objectImage" src="" alt="Gambar objek museum">
      </div>

      <div class="modal-body">

        <div class="section-label">KEUNIKAN</div>
        <p class="description" id="objectUnique"></p>

        <div class="section-label">NILAI SEJARAH</div>
        <p class="description" id="objectHistory"></p>

        <div class="section-label">FAKTA MENARIK</div>
        <p class="description" id="objectFact"></p>

        <button class="original-btn" id="showOriginal">
          ◉ LIHAT GAMBAR ASLI
        </button>

        <button class="back-image-btn" id="backToPixel">
          ← KEMBALI KE GAMBAR PIXEL
        </button>

      </div>

      <div class="footer-note">
        CULTURAL QUEST · MENJELAJAHI WARISAN BUDAYA
      </div>

    </div>
  </div>

</div>

<script>
/* =========================
   DATA OBJEK MUSEUM
========================= */

const exhibits = [
  {
    name: "Candi Lemah Duwur",

    pixel:
      "https://raw.githubusercontent.com/redbals359-cyber/culturalquest/main/Candi%20lemah%20duwur%20.png",

    original:
      "https://raw.githubusercontent.com/redbals359-cyber/culturalquest/main/Screenshot_20261026-233237.jpg",

    unique:
      "Gundukan tanah yang lebih tinggi daripada area sekitarnya menjadi ciri khas situs ini.",

    history:
      "Bentuk permukaan tanah dan reruntuhan candi dapat membantu mengkaji perkembangan situs pada masa kerajaan.",

    fact:
      "Lemah Dhuwur berarti “tanah tinggi”, tetapi asal-usul gundukan tersebut masih perlu diteliti lebih lanjut.",

    x: 230
  },

  {
    name: "Bata Merah",

    pixel:
      "https://raw.githubusercontent.com/redbals359-cyber/culturalquest/main/Batu%20bata.png",

    original:
      "https://raw.githubusercontent.com/redbals359-cyber/culturalquest/main/Screenshot_20261026-234840.jpg",

    unique:
      "Menggunakan bata merah berukuran sekitar 37 × 24 × 10 cm, lebih besar daripada bata modern pada umumnya.",

    history:
      "Menunjukkan pemanfaatan tanah liat dalam perkembangan teknologi bangunan masa lampau.",

    fact:
      "Susunan bata kuno menjadi petunjuk untuk mempelajari teknik konstruksi sebelum penggunaan semen modern.",

    x: 560
  },

  {
    name: "Struktur Bangunan Candi Lemah Duwur",

    pixel:
      "https://raw.githubusercontent.com/redbals359-cyber/culturalquest/main/Struktur%20bangunan.png",

    original:
      "https://raw.githubusercontent.com/redbals359-cyber/culturalquest/main/Screenshot_20261026-233256.jpg",

    unique:
      "Berdiri di atas gundukan tanah di tengah persawahan Desa Pamotan, Porong, dengan reruntuhan yang dinaungi pohon beringin besar.",

    history:
      "Sisa bangunan dan batu lingga menjadi petunjuk untuk mengkaji sejarah serta tradisi keagamaan masa lampau.",

    fact:
      "Meski sebagian besar bangunannya telah runtuh, sisa fondasinya masih menyimpan jejak arsitektur kuno.",

    x: 890
  }
];


/* =========================
   SETUP CANVAS
========================= */

const canvas = document.getElementById("museum");
const ctx = canvas.getContext("2d");

const world = {
  width: 1200,
  height: 650,
  floorY: 515
};

let viewWidth = 0;
let viewHeight = 0;
let scale = 1;
let cameraX = 0;

const player = {
  x: 85,
  y: world.floorY,
  width: 30,
  height: 53,
  speed: 4,
  direction: 1
};

const keys = {
  left: false,
  right: false
};

let activeExhibit = null;
let modalOpen = false;
let animationFrame = 0;


/* =========================
   LOAD PIXEL ART IMAGES
========================= */

const pixelImages = exhibits.map(item => {
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.src = item.pixel;
  img.onload = () => {};
  return img;
});


/* =========================
   RESIZE CANVAS
========================= */

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.floor(rect.width * dpr);
  canvas.height = Math.floor(rect.height * dpr);

  viewWidth = rect.width;
  viewHeight = rect.height;

  scale = viewHeight / world.height;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();


/* =========================
   DRAW HELPERS
========================= */

function rectangle(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(
    Math.round(x),
    Math.round(y),
    Math.round(w),
    Math.round(h)
  );
}

function drawText(text, x, y, size, color, align = "center") {
  ctx.fillStyle = color;
  ctx.font = `bold ${size}px monospace`;
  ctx.textAlign = align;
  ctx.fillText(text, x, y);
}


/* =========================
   DRAW MUSEUM ROOM
========================= */

function drawRoom() {
  // Dinding museum
  rectangle(0, 0, world.width, world.floorY, "#d9c8a8");

  // Dinding atas
  rectangle(0, 0, world.width, 28, "#70523c");

  // Panel dinding
  for (let x = 0; x < world.width; x += 150) {
    rectangle(x, 28, 3, world.floorY - 28, "#c2ad8b");
  }

  // Garis dekorasi dinding
  rectangle(0, 90, world.width, 5, "#b79b71");
  rectangle(0, 100, world.width, 2, "#f0e0c2");

  // Lampu museum
  for (let x = 130; x < world.width; x += 300) {
    rectangle(x, 30, 65, 8, "#8b704d");
    rectangle(x + 7, 38, 51, 6, "#f7e5a9");

    ctx.globalAlpha = 0.12;
    rectangle(x - 20, 44, 105, 110, "#fff1b5");
    ctx.globalAlpha = 1;
  }

  // Lantai
  rectangle(0, world.floorY, world.width, 150, "#8e7557");

  // Papan lantai
  for (let y = world.floorY; y < world.height; y += 35) {
    rectangle(0, y, world.width, 2, "#6c5743");
  }

  for (let x = 0; x < world.width; x += 100) {
    rectangle(x, world.floorY, 2, 150, "#6c5743");
  }

  // Lis dinding
  rectangle(0, world.floorY - 12, world.width, 12, "#65472f");
  rectangle(0, world.floorY - 12, world.width, 3, "#e2c391");

  // Karpet tengah
  rectangle(0, world.floorY + 80, world.width, 42, "#6c4735");
  rectangle(0, world.floorY + 84, world.width, 3, "#d7ad70");
  rectangle(0, world.floorY + 115, world.width, 3, "#d7ad70");
}


/* =========================
   DRAW EXHIBITS
========================= */

function drawExhibit(item, index) {
  const x = item.x;
  const y = 230;

  // Bingkai luar
  rectangle(x - 69, y - 12, 138, 150, "#60432d");
  rectangle(x - 64, y - 7, 128, 140, "#d6b981");

  // Latar gambar
  rectangle(x - 57, y, 114, 105, "#eee2c9");

  const img = pixelImages[index];

  if (img && img.complete && img.naturalWidth > 0) {
    const maxW = 100;
    const maxH = 90;

    const ratio = Math.min(
      maxW / img.naturalWidth,
      maxH / img.naturalHeight
    );

    const w = img.naturalWidth * ratio;
    const h = img.naturalHeight * ratio;

    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, x - w / 2, y + 5 + (90 - h) / 2, w, h);
  } else {
    // Gambar cadangan saat gambar sedang dimuat
    rectangle(x - 32, y + 25, 64, 48, "#b65e39");
    rectangle(x - 24, y + 15, 48, 10, "#b65e39");
    rectangle(x - 20, y + 73, 40, 8, "#8e442d");
  }

  // Label nama objek
  rectangle(x - 65, y + 111, 130, 20, "#65472f");

  const shortNames = [
    "CANDI LEMAH DUWUR",
    "BATA MERAH",
    "STRUKTUR BANGUNAN"
  ];

  drawText(shortNames[index], x, y + 125, 8, "#fff1d7");

  // Lampu kecil di atas bingkai
  rectangle(x - 13, y - 25, 26, 5, "#8b704d");
  rectangle(x - 9, y - 20, 18, 7, "#f8e6ad");

  // Penanda interaksi
  const distance = Math.abs(player.x - x);

  if (distance < 95) {
    const bounce = Math.sin(animationFrame / 8) * 3;

    rectangle(x - 9, y - 55 + bounce, 18, 18, "#496b50");
    drawText("!", x, y - 41 + bounce, 15, "#ffffff");
  }
}


/* =========================
   DRAW PIXEL CHARACTER
========================= */

function drawPlayer() {
  const x = player.x;
  const y = player.y;

  const step = Math.sin(animationFrame / 3) * 3;
  const walking = keys.left || keys.right;

  // Bayangan
  ctx.fillStyle = "rgba(30,20,10,.25)";
  ctx.beginPath();
  ctx.ellipse(x, y + 2, 22, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  // Kaki
  rectangle(x - 10, y - 20, 8, 20 + (walking ? step : 0), "#44362c");
  rectangle(x + 2, y - 20, 8, 20 - (walking ? step : 0), "#44362c");

  // Sepatu
  rectangle(x - 13, y - 4 + (walking ? step : 0), 12, 5, "#2b2521");
  rectangle(x + 1, y - 4 - (walking ? step : 0), 13, 5, "#2b2521");

  // Badan
  rectangle(x - 14, y - 44, 28, 26, "#496b50");
  rectangle(x - 14, y - 23, 28, 4, "#354d39");

  // Tangan
  rectangle(x - 19, y - 40, 6, 18, "#d9a77e");
  rectangle(x + 13, y - 40, 6, 18, "#d9a77e");

  // Kepala
  rectangle(x - 12, y - 61, 24, 21, "#d9a77e");

  // Rambut
  rectangle(x - 13, y - 63, 26, 8, "#38291f");
  rectangle(x - 13, y - 57, 5, 7, "#38291f");
  rectangle(x + 8, y - 57, 5, 5, "#38291f");

  // Mata menghadap arah gerak
  const eyeX = player.direction === 1 ? x + 5 : x - 7;
  rectangle(eyeX, y - 53, 3, 3, "#29231f");
}


/* =========================
   CAMERA & GAME LOOP
========================= */

function update() {
  if (!modalOpen) {
    if (keys.left) {
      player.x -= player.speed;
      player.direction = -1;
    }

    if (keys.right) {
      player.x += player.speed;
      player.direction = 1;
    }
  }

  player.x = Math.max(25, Math.min(world.width - 25, player.x));

  // Kamera mengikuti karakter
  const visibleWorldWidth = viewWidth / scale;

  cameraX = player.x - visibleWorldWidth / 2;
  cameraX = Math.max(
    0,
    Math.min(world.width - visibleWorldWidth, cameraX)
  );

  // Deteksi objek terdekat
  activeExhibit = null;
  let nearest = Infinity;

  for (const item of exhibits) {
    const distance = Math.abs(player.x - item.x);

    if (distance < 82 && distance < nearest) {
      activeExhibit = item;
      nearest = distance;
    }
  }

  const interactButton = document.getElementById("interact");
  const hint = document.getElementById("hint");

  if (activeExhibit && !modalOpen) {
    interactButton.style.display = "block";
    hint.textContent = "Kamu menemukan objek pameran!";
  } else {
    interactButton.style.display = "none";
    hint.textContent = "Jelajahi museum dan dekati objek pameran.";
  }
}

function render() {
  animationFrame++;

  update();

  ctx.clearRect(0, 0, viewWidth, viewHeight);

  ctx.save();

  // Skala responsif dan kamera
  ctx.scale(scale, scale);
  ctx.translate(-cameraX, 0);

  drawRoom();

  exhibits.forEach((item, index) => {
    drawExhibit(item, index);
  });

  drawPlayer();

  ctx.restore();

  requestAnimationFrame(render);
}

render();


/* =========================
   MOVEMENT BUTTONS
========================= */

function bindMovement(buttonId, direction) {
  const button = document.getElementById(buttonId);

  const start = event => {
    event.preventDefault();
    keys[direction] = true;
  };

  const stop = event => {
    event.preventDefault();
    keys[direction] = false;
  };

  button.addEventListener("pointerdown", start);
  button.addEventListener("pointerup", stop);
  button.addEventListener("pointerleave", stop);
  button.addEventListener("pointercancel", stop);
}

bindMovement("leftBtn", "left");
bindMovement("rightBtn", "right");

window.addEventListener("pointerup", () => {
  keys.left = false;
  keys.right = false;
});

window.addEventListener("blur", () => {
  keys.left = false;
  keys.right = false;
});

// Kontrol keyboard untuk komputer
window.addEventListener("keydown", event => {
  if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") {
    keys.left = true;
    event.preventDefault();
  }

  if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") {
    keys.right = true;
    event.preventDefault();
  }

  if (
    (event.key === "Enter" || event.key === " ") &&
    activeExhibit &&
    !modalOpen
  ) {
    openInfo(activeExhibit);
    event.preventDefault();
  }

  if (event.key === "Escape") {
    closeInfo();
  }
});

window.addEventListener("keyup", event => {
  if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") {
    keys.left = false;
  }

  if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") {
    keys.right = false;
  }
});


/* =========================
   INFORMATION PANEL
========================= */

const modal = document.getElementById("infoModal");
const objectImage = document.getElementById("objectImage");
const originalButton = document.getElementById("showOriginal");
const backPixelButton = document.getElementById("backToPixel");

let currentItem = null;
let showingOriginal = false;

function openInfo(item) {
  if (!item) return;

  currentItem = item;
  showingOriginal = false;
  modalOpen = true;

  document.getElementById("objectTitle").textContent = item.name;
  document.getElementById("objectUnique").textContent = item.unique;
  document.getElementById("objectHistory").textContent = item.history;
  document.getElementById("objectFact").textContent = item.fact;

  showPixelImage();

  modal.classList.add("show");
  keys.left = false;
  keys.right = false;
}

document.getElementById("interact").addEventListener("click", () => {
  if (activeExhibit) {
    openInfo(activeExhibit);
  }
});

function showPixelImage() {
  if (!currentItem) return;

  showingOriginal = false;

  objectImage.classList.remove("original");
  objectImage.alt = "Gambar pixel art " + currentItem.name;
  objectImage.src = currentItem.pixel;

  originalButton.style.display = "block";
  backPixelButton.style.display = "none";
}

function showOriginalImage() {
  if (!currentItem) return;

  showingOriginal = true;

  objectImage.classList.add("original");
  objectImage.alt = "Foto asli " + currentItem.name;
  objectImage.src = currentItem.original;

  originalButton.style.display = "none";
  backPixelButton.style.display = "block";
}

originalButton.addEventListener("click", showOriginalImage);
backPixelButton.addEventListener("click", showPixelImage);

function closeInfo() {
  modal.classList.remove("show");
  modalOpen = false;
  currentItem = null;
}

document.getElementById("closeModal").addEventListener("click", closeInfo);

modal.addEventListener("click", event => {
  if (event.target === modal) {
    closeInfo();
  }
});


/* =========================
   HOME & FULLSCREEN
========================= */

document.getElementById("homeBtn").addEventListener("click", () => {
  window.location.href = "https://culturalheritage.vercel.app/";
});

document.getElementById("fullscreenBtn").addEventListener("click", async () => {
  try {
    if (!document.fullscreenElement) {
      await document.getElementById("game").requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (error) {
    alert("Mode layar penuh tidak didukung oleh browser ini.");
  }
});
</script>

</body>
</html>
